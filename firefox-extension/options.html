<!doctype html><html><head><meta charset="utf-8"><title>NekoRoute Firefox Bridge Settings</title><style>body{max-width:760px;margin:40px auto;background:#070b08;color:#e4e4e7;font:15px system-ui;padding:0 20px}textarea{width:100%;min-height:160px;background:#050807;color:#e4e4e7;border:1px solid #27272a;border-radius:12px;padding:12px;box-sizing:border-box}button{margin-top:12px;background:#34d399;color:#052e20;border:0;border-radius:10px;padding:10px 16px;font-weight:800}.note{color:#a1a1aa;line-height:1.6}label{display:flex;gap:10px;align-items:flex-start;margin-top:18px}</style></head><body><h1>NekoRoute Firefox Bridge</h1><p class="note">List NekoRoute website origins you trust to hand one-time proxy tickets to this extension. Put one origin per line. Do not add random websites.</p><textarea id="origins"></textarea><label><input type="checkbox" id="leakProtection"><span><b>Leak protection while routed tabs are open</b><br><span class="note">Temporarily disables Firefox network prediction and sets WebRTC to proxy-only, then restores the previous settings after the last routed tab closes.</span></span></label><br><button id="save">Save settings</button><p id="status" class="note"></p><script src="options.js"></script></body></html>
